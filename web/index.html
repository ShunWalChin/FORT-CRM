<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>FORT-CRM — Minas Peças, Agrofort e Fort Tintas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2306060e'/><text y='23' x='16' text-anchor='middle' font-size='17' fill='%2300f0ff' font-family='monospace' font-weight='bold'>F</text></svg>">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/temas.css">
<link rel="stylesheet" href="/mobile.css">
<script>
/*
 * O tema é aplicado ANTES da primeira pintura, e por isso está aqui em vez de
 * no módulo. `app.js` é `type="module"`, ou seja, adiado: quando ele roda, a
 * página já foi pintada uma vez. Quem escolheu "Papel" veria a tela nascer
 * preta e clarear no quadro seguinte — um flash a cada navegação.
 *
 * Falha em silêncio de propósito: em janela anônima ou com armazenamento
 * bloqueado pela política da máquina, o acesso lança. Perder a preferência é
 * aceitável; a tela não abrir, não.
 */
try {
  var t = localStorage.getItem('fortcrm.tema');
  if (['cockpit','oficina','cerrado','papel','meia-noite'].indexOf(t) >= 0) {
    document.documentElement.dataset.tema = t;
  }
} catch (e) { /* sem persistência de tema */ }
</script>
</head>
<body>
<div id="raiz"><div class="carregando">carregando…</div></div>
<script type="module" src="/app.js"></script>
</body>
</html>
